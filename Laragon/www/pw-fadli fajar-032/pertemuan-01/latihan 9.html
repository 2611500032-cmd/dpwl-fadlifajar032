<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATIHAN P1</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f2f2;
    padding:20px;
}

h1{
    color:#0070c9;
    font-size:60px;
    text-decoration:underline;
    margin-bottom:20px;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* Kotak Profil */
.profil{
    background:#0057b8;
    color:white;
    padding:15px 40px;
    border-radius:12px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.profil p{
    font-size:16px;
}

/* Garis Atas */
.garis{
    width:650px;
    height:4px;
    background:#003366;
    margin:20px 0;
}

/* Bagian Header Navigation Main Footer */
.menu{
    display:flex;
    justify-content:space-between;
    width:850px;
    align-items:flex-start;
}

.kolom{
    text-align:center;
}

.box{
    padding:10px 18px;
    border-radius:10px;
    border:2px solid;
    font-weight:bold;
    margin-bottom:12px;
}

/* Warna */
.header{background:#ffd1dc;border-color:#ff4d88;}
.nav{background:#d9ecff;border-color:#3399ff;}
.main{background:#d8ffd8;border-color:#28a745;}
.footer{background:#ffe6c7;border-color:#ff8c00;}

.tentang{background:#ead9ff;border-color:#8a5cff;}
.hobi{background:#fff3bf;border-color:#f4b400;}
.belajar{background:#d8fff2;border-color:#20c997;}
.riwayat{background:#ffd8ea;border-color:#ff5fa2;}
.kontak{background:#d8ecff;border-color:#3399ff;}

.sub{
    margin-left:20px;
    border-left:3px solid #003366;
    padding-left:15px;
    text-align:left;
}

.item{
    background:white;
    border:1px solid #999;
    border-radius:8px;
    padding:8px 15px;
    margin:8px 0;
}
</style>

</head>
<body>

<h1>LATIHAN P1</h1>

<div class="container">

    <div class="profil">
        Profil Mahasiswa
        <p>(Halaman Web)</p>
    </div>

    <div class="garis"></div>

    <div class="menu">

        <!-- Header -->
        <div class="kolom">
            <div class="box header">Header</div>

            <div class="sub">
                <div class="item">Judul</div>
                <div class="item">Deskripsi</div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="kolom">
            <div class="box nav">Navigation</div>
        </div>

        <!-- Main -->
        <div class="kolom">

            <div class="box main">Main</div>

            <div class="sub">
                <div class="box tentang">Tentang Saya</div>
                <div class="item">Foto</div>
                <div class="item">Deskripsi</div>
            </div>

            <div class="sub">
                <div class="box hobi">Hobi</div>
                <div class="item">List</div>
            </div>

            <div class="sub">
                <div class="box belajar">Tahapan Belajar</div>
                <div class="item">Ordered List</div>
            </div>

            <div class="sub">
                <div class="box riwayat">Riwayat Pendidikan</div>
                <div class="item">Table</div>
            </div>

            <div class="sub">
                <div class="box kontak">Kontak</div>
                <div class="item">Link</div>
            </div>

        </div>

        <!-- Footer -->
        <div class="kolom">
            <div class="box footer">Footer</div>
        </div>

    </div>

</div>

</body>
</html>
